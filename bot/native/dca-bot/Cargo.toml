[package]
name = "dca-bot"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "dca-bot"
path = "src/main.rs"

[dependencies]
dca-core = { path = "../dca-core" }
dca-state = { path = "../dca-state" }
serenity = { version = "0.12", default-features = false, features = ["builder", "client", "gateway", "model", "http", "utils", "rustls_backend"] }
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.8", features = ["macros", "multipart"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }
tower = { version = "0.5", features = ["util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
rand = "0.8"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
roxmltree = "0.20"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
libc = "0.2"
unicode-normalization = "0.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
