[package]
name = "dca-state"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["sync", "fs", "time", "rt", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
jsonwebtoken = "9"
regex = "1.10"
rand = "0.8"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1.38", features = ["full"] }
